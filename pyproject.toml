[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmap-ncm"
version = "0.2.0"
description = "Reference semantics and mechanism-isolation experiments for NCM-Psi memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MindMap research collaboration"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
reader = [
  "torch==2.13.0",
  "transformers==5.15.0",
  "safetensors==0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
