name: research-ci

on:
  push:
    branches:
      - main
      - research/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy pytest
      - name: Run invariants
        run: python -m pytest -q
      - name: Run reduced mechanism pilot
        run: python experiments/epistemic_branch_pilot.py --scenarios 25 --output-dir /tmp/ncm3e-results
      - name: Run reduced fault pilot
        run: python experiments/extraction_noise_pilot.py --scenarios 25 --repetitions 2 --output-dir /tmp/ncm3e-results
