name: track-e-observability

on:
  push:
    branches:
      - research/track-e-observability-v0.1
  pull_request:
    paths:
      - 'experiments/track_e_fault_observability_v0_1.py.gz'
      - 'results/track_e_fault_observability_v0_1/**'
      - '.github/workflows/track-e-observability.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decompress source
        run: gzip -dc experiments/track_e_fault_observability_v0_1.py.gz > experiments/track_e_fault_observability_v0_1.py
      - name: Reproduce Track E outputs
        run: |
          rm -rf /tmp/track-e-results
          python experiments/track_e_fault_observability_v0_1.py \
            --renamings 20 \
            --output-dir /tmp/track-e-results
      - name: Verify deterministic outputs
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          timing_fields = {'median_validate_us', 'p95_validate_us'}

          def rows(path: str, ignored: set[str] = set()):
              with Path(path).open(newline='') as handle:
                  return [
                      {key: value for key, value in row.items() if key not in ignored}
                      for row in csv.DictReader(handle)
                  ]

          checks = [
              (
                  'results/track_e_fault_observability_v0_1/summary.csv',
                  '/tmp/track-e-results/summary.csv',
                  timing_fields,
              ),
              (
                  'results/track_e_fault_observability_v0_1/detection_matrix.csv',
                  '/tmp/track-e-results/detection_matrix.csv',
                  set(),
              ),
          ]
          for expected_path, actual_path, ignored in checks:
              if rows(expected_path, ignored) != rows(actual_path, ignored):
                  raise SystemExit(
                      f'deterministic CSV fields differ: {expected_path} vs {actual_path}'
                  )

          source = Path('experiments/track_e_fault_observability_v0_1.py').read_bytes()
          expected_hash = json.loads(
              Path('results/track_e_fault_observability_v0_1/metadata.json').read_text()
          )['script_sha256']
          actual_hash = hashlib.sha256(source).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit(f'script hash mismatch: {actual_hash} != {expected_hash}')
          PY
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-e-observability-v0.1-review
          path: |
            experiments/track_e_fault_observability_v0_1.py
            /tmp/track-e-results/summary.csv
            /tmp/track-e-results/detection_matrix.csv
            /tmp/track-e-results/metadata.json
          if-no-files-found: error
