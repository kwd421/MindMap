name: test

on:
  push:
    branches:
      - main
      - research/v0.2-reconciled
      - research/track-x-v0.1-raw-verifier
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Track S semantic conformance
        run: python experiments/s_track_conformance.py
      - name: Track X raw verifier P0
        run: python experiments/track_x_v01.py --output-dir /tmp/track_x_v01
      - name: Verify committed Track X outputs
        run: |
          diff -u results/track_x_v01/verification_rows.csv /tmp/track_x_v01/verification_rows.csv
          diff -u results/track_x_v01/downstream_development_oracle_raw_ceiling.csv /tmp/track_x_v01/downstream_development_oracle_raw_ceiling.csv
          diff -u results/track_x_v01/downstream_development_raw_verifier.csv /tmp/track_x_v01/downstream_development_raw_verifier.csv
          diff -u results/track_x_v01/downstream_development_structured_only.csv /tmp/track_x_v01/downstream_development_structured_only.csv
          diff -u results/track_x_v01/downstream_heldout_oracle_raw_ceiling.csv /tmp/track_x_v01/downstream_heldout_oracle_raw_ceiling.csv
          diff -u results/track_x_v01/downstream_heldout_raw_verifier.csv /tmp/track_x_v01/downstream_heldout_raw_verifier.csv
          diff -u results/track_x_v01/downstream_heldout_structured_only.csv /tmp/track_x_v01/downstream_heldout_structured_only.csv
          diff -u results/track_x_v01/summary.json /tmp/track_x_v01/summary.json
      - name: Upload Track S outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-track-conformance
          path: |
            results/s_track_conformance_rows.csv
            results/s_track_conformance_summary.json
          if-no-files-found: error
      - name: Upload Track X outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-x-v01-p0
          path: /tmp/track_x_v01
          if-no-files-found: error
