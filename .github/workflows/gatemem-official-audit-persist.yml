name: GateMem official audit persist

on:
  push:
    branches:
      - research/gatemem-official-repro-audit
    paths:
      - experiments/audit_gatemem_official.py
      - experiments/run_pr43_gatemem_noapi.py
      - .github/workflows/gatemem-official-audit-persist.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: gatemem-official-audit-persist
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/gatemem-official-repro-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Clone exact public inputs
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/rzhub/GateMem.git /tmp/GateMem
          GATEMEM_SHA="$(git -C /tmp/GateMem rev-parse HEAD)"
          PR43_SHA="$(gh api repos/kwd421/MindMap/pulls/43 --jq .head.sha)"
          PR43_REF="$(gh api repos/kwd421/MindMap/pulls/43 --jq .head.ref)"
          git clone --quiet https://github.com/kwd421/MindMap.git /tmp/MindMap-pr43
          git -C /tmp/MindMap-pr43 fetch --quiet origin "$PR43_SHA"
          git -C /tmp/MindMap-pr43 checkout --quiet --detach "$PR43_SHA"
          echo "gatemem_sha=$GATEMEM_SHA" >> "$GITHUB_OUTPUT"
          echo "pr43_sha=$PR43_SHA" >> "$GITHUB_OUTPUT"
          echo "pr43_ref=$PR43_REF" >> "$GITHUB_OUTPUT"

      - name: Run R0 source and boundary audit
        id: r0
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/gatemem-public-audit/r0
          python experiments/audit_gatemem_official.py \
            --gatemem-root /tmp/GateMem \
            --pr43-root /tmp/MindMap-pr43 \
            --output /tmp/gatemem-public-audit/r0/audit.json \
            > /tmp/gatemem-public-audit/r0/stdout.log \
            2> /tmp/gatemem-public-audit/r0/stderr.log

      - name: Install and test exact PR #43 head
        id: pr43_tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/gatemem-public-audit/pr43
          python -m pip install --upgrade pip \
            > /tmp/gatemem-public-audit/pr43/pip-upgrade.log 2>&1
          if [ -f /tmp/MindMap-pr43/pyproject.toml ]; then
            python -m pip install -e '/tmp/MindMap-pr43[dev]' \
              > /tmp/gatemem-public-audit/pr43/install.log 2>&1
          elif [ -f /tmp/MindMap-pr43/requirements.txt ]; then
            python -m pip install -r /tmp/MindMap-pr43/requirements.txt \
              > /tmp/gatemem-public-audit/pr43/install.log 2>&1
          else
            echo 'No pyproject.toml or requirements.txt found.' \
              > /tmp/gatemem-public-audit/pr43/install.log
          fi
          python -m compileall -q /tmp/MindMap-pr43 \
            > /tmp/gatemem-public-audit/pr43/compile.log 2>&1
          if [ -d /tmp/MindMap-pr43/tests ]; then
            python -m pytest -q /tmp/MindMap-pr43/tests \
              > /tmp/gatemem-public-audit/pr43/pytest.log 2>&1
          else
            echo 'No tests directory.' > /tmp/gatemem-public-audit/pr43/pytest.log
          fi

      - name: Run R1 no-API entry-point discovery
        id: r1
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/run_pr43_gatemem_noapi.py \
            --pr43-root /tmp/MindMap-pr43 \
            --gatemem-root /tmp/GateMem \
            --output-root /tmp/gatemem-public-audit/r1 \
            > /tmp/gatemem-public-audit/r1-stdout.log \
            2> /tmp/gatemem-public-audit/r1-stderr.log

      - name: Build accepted-status manifest
        if: always()
        env:
          GATEMEM_SHA: ${{ steps.revisions.outputs.gatemem_sha }}
          PR43_SHA: ${{ steps.revisions.outputs.pr43_sha }}
          PR43_REF: ${{ steps.revisions.outputs.pr43_ref }}
          R0_OUTCOME: ${{ steps.r0.outcome }}
          TEST_OUTCOME: ${{ steps.pr43_tests.outcome }}
          R1_OUTCOME: ${{ steps.r1.outcome }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gatemem-public-audit
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/gatemem-public-audit')
          r0_path = root / 'r0' / 'audit.json'
          r1_path = root / 'r1' / 'discovery.json'
          r0 = json.loads(r0_path.read_text()) if r0_path.exists() else None
          r1 = json.loads(r1_path.read_text()) if r1_path.exists() else None
          successes = {} if r1 is None else r1.get('successes', {})

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          files = sorted(path for path in root.rglob('*') if path.is_file())
          status = {
              'study': 'GateMem official public benchmark source/execution gate',
              'classification': 'R0 source/boundary audit plus R1 command discovery; not an accepted benchmark score',
              'gatemem_commit': os.environ['GATEMEM_SHA'],
              'pr43_commit': os.environ['PR43_SHA'],
              'pr43_ref': os.environ['PR43_REF'],
              'r0_outcome': os.environ['R0_OUTCOME'],
              'pr43_test_outcome': os.environ['TEST_OUTCOME'],
              'r1_discovery_outcome': os.environ['R1_OUTCOME'],
              'r0_contract_ok': bool(r0 and r0['upstream']['required_contract_ok']),
              'r1_data_producing_successes': sorted(successes),
              'official_score_accepted': False,
              'next_gate': (
                  'validate official checkpoint coverage and deterministic official metrics for always_abstain/raw_bm25'
                  if successes
                  else 'expose one stable PR #43 all-domain no-API command/API and rerun R1'
              ),
              'artifact_sha256': {
                  path.relative_to(root).as_posix(): digest(path) for path in files
              },
          }
          (root / 'STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          lines = [
              '# GateMem public benchmark gate',
              '',
              '> R0/R1 audit only; no official score is accepted by this workflow.',
              '',
              f"- GateMem commit: `{status['gatemem_commit']}`",
              f"- PR #43 commit: `{status['pr43_commit']}` (`{status['pr43_ref']}`)",
              f"- R0 source contract: `{status['r0_outcome']}` / contract `{status['r0_contract_ok']}`",
              f"- PR #43 tests: `{status['pr43_test_outcome']}`",
              f"- R1 discovery: `{status['r1_discovery_outcome']}`",
              f"- Data-producing no-API surfaces: `{status['r1_data_producing_successes']}`",
              f"- Official score accepted: `{status['official_score_accepted']}`",
              f"- Next gate: {status['next_gate']}",
          ]
          (root / 'STATUS.md').write_text('\n'.join(lines) + '\n')
          PY
          cat /tmp/gatemem-public-audit/STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist audit artifact on branch
        if: always()
        run: |
          set -euo pipefail
          rm -rf results/gatemem_official_audit
          mkdir -p results/gatemem_official_audit
          cp -R /tmp/gatemem-public-audit/. results/gatemem_official_audit/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/gatemem_official_audit
          if git diff --cached --quiet; then
            echo 'No audit artifact drift.'
          else
            git commit -m 'results(gatemem): persist official R0/R1 audit'
            git push origin HEAD:research/gatemem-official-repro-audit
          fi

      - name: Post durable checkpoint to Issue #4
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## [Session B] GateMem official persisted R0/R1 checkpoint'
            echo
            echo "Run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`"
            echo
            if [ -f /tmp/gatemem-public-audit/STATUS.md ]; then
              tail -n +2 /tmp/gatemem-public-audit/STATUS.md
            else
              echo 'The workflow failed before status generation. No benchmark score is accepted.'
            fi
            echo
            echo 'Committed artifact path: `results/gatemem_official_audit/` on `research/gatemem-official-repro-audit`.'
          } > /tmp/gatemem-public-audit/issue-comment.md
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gatemem-public-audit/issue-comment.md

      - name: Upload complete artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatemem-official-audit-persist
          path: /tmp/gatemem-public-audit
          if-no-files-found: error

      - name: Enforce source/test gate
        if: always()
        env:
          R0_OUTCOME: ${{ steps.r0.outcome }}
          TEST_OUTCOME: ${{ steps.pr43_tests.outcome }}
          R1_OUTCOME: ${{ steps.r1.outcome }}
        run: |
          set -euo pipefail
          test "$R0_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$R1_OUTCOME" = success
