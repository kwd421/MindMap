name: GateMem PR46 R0 source and boundary audit

on:
  push:
    branches:
      - research/gatemem-official-repro-audit
    paths:
      - docs/GATEMEM_OFFICIAL_REPRO_PROTOCOL.md
      - experiments/audit_gatemem_official.py
      - tests/test_audit_gatemem_official.py
      - tests/test_reproduce_gatemem_pr46.py
      - .github/workflows/gatemem-official-r0.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  MINDMAP_PRODUCING_COMMIT: 8fd14b3e631a8faeae46f2e73273a94c11a129f4
  MINDMAP_REFERENCE_COMMIT: 5e877bf5e4bfffda700ae0b8b5634bc734ac7e65
  GATEMEM_COMMIT: 603f9f4b4ba4b77f043c20f85687fa016fd720b0
  GATEMEM_SCORER_SHA256: 3d546a21778202959a9df12bac44c196a7f20a248cf5a2cb34f0d9b9c2623d8a
  REFERENCE_ROWS_SHA256: 8d17aa6915f02e6abbc2f1c7b50410996ca354c2f177cec46c2cc5cfcd789212

jobs:
  r0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout independent audit source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare artifact directory
        run: mkdir -p /tmp/gatemem-pr46-r0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run independent audit unit tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tests \
            -p 'test_*gatemem*.py' \
            -v | tee /tmp/gatemem-pr46-r0/audit-unittest.log

      - name: Clone exact producing implementation and official benchmark
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/kwd421/MindMap.git /tmp/MindMap-pr46
          git -C /tmp/MindMap-pr46 fetch --quiet origin "$MINDMAP_PRODUCING_COMMIT"
          git -C /tmp/MindMap-pr46 checkout --quiet --detach "$MINDMAP_PRODUCING_COMMIT"
          test "$(git -C /tmp/MindMap-pr46 rev-parse HEAD)" = "$MINDMAP_PRODUCING_COMMIT"
          test -z "$(git -C /tmp/MindMap-pr46 status --porcelain --untracked-files=all)"

          git -C /tmp/MindMap-pr46 fetch --quiet origin "$MINDMAP_REFERENCE_COMMIT"
          git -C /tmp/MindMap-pr46 show \
            "$MINDMAP_REFERENCE_COMMIT:results/gatemem_official_endpoints_v0_1/rows.csv" \
            > /tmp/gatemem-pr46-r0/reference_rows.csv
          echo "$REFERENCE_ROWS_SHA256  /tmp/gatemem-pr46-r0/reference_rows.csv" \
            | sha256sum -c -

          git clone --filter=blob:none https://github.com/rzhub/GateMem.git /tmp/GateMem
          git -C /tmp/GateMem checkout --quiet --detach "$GATEMEM_COMMIT"
          test "$(git -C /tmp/GateMem rev-parse HEAD)" = "$GATEMEM_COMMIT"
          test -z "$(git -C /tmp/GateMem status --porcelain --untracked-files=all)"
          echo "$GATEMEM_SCORER_SHA256  /tmp/GateMem/bench/eval/scorer.py" \
            | sha256sum -c -

      - name: Install and test the exact PR46 producing commit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '/tmp/MindMap-pr46[dev]'
          python -m pip install numpy tqdm PyYAML requests scikit-learn
          python -m pytest -q /tmp/MindMap-pr46/tests \
            | tee /tmp/gatemem-pr46-r0/producing-commit-pytest.log

      - name: Audit source, scorer, data and capability boundary
        run: |
          set -euo pipefail
          python experiments/audit_gatemem_official.py \
            --gatemem-root /tmp/GateMem \
            --mindmap-root /tmp/MindMap-pr46 \
            --output /tmp/gatemem-pr46-r0/audit.json \
            --expected-gatemem-commit "$GATEMEM_COMMIT" \
            --expected-mindmap-commit "$MINDMAP_PRODUCING_COMMIT" \
            --expected-scorer-sha256 "$GATEMEM_SCORER_SHA256" \
            | tee /tmp/gatemem-pr46-r0/audit.stdout.log

      - name: Build R0 summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(
              Path('/tmp/gatemem-pr46-r0/audit.json').read_text()
          )
          upstream = audit['upstream']
          inventory = upstream['data_inventory']
          target = audit['mindmap_target']
          boundary = target['boundary_scan']
          lines = [
              '# GateMem PR #46 R0 audit',
              '',
              '> Exact-source and capability audit; not an endpoint rerun or architecture result.',
              '',
              f"- MindMap producing commit: `{target['commit']}`",
              f"- GateMem commit: `{upstream['commit']}`",
              f"- Official scorer SHA-256: `{upstream['scorer_sha256']}`",
              f"- Official contract valid: `{upstream['required_contract_ok']}`",
              f"- Official checkpoint IDs: `{inventory['unique_explicit_checkpoint_ids']}`",
              f"- Official data files: `{inventory['json_files']}`",
              f"- Files by domain: `{inventory['files_by_domain']}`",
              f"- GateMem-related executable entry points: `{target['entry_points']}`",
              f"- Static review-token categories: `{sorted(boundary['token_findings'])}`",
              '',
              'Static token hits are review leads only. The R1 workflow executes the exact reviewed CLI and validates complete official outputs.',
          ]
          Path('/tmp/gatemem-pr46-r0/STATUS.md').write_text(
              '\n'.join(lines) + '\n'
          )
          PY
          cat /tmp/gatemem-pr46-r0/STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post R0 checkpoint to Issue #4
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## [Session B] GateMem PR #46 independent R0 checkpoint'
            echo
            echo "Run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`"
            echo "Status: \`${{ job.status }}\`"
            echo
            if [ -f /tmp/gatemem-pr46-r0/STATUS.md ]; then
              tail -n +2 /tmp/gatemem-pr46-r0/STATUS.md
            else
              echo 'R0 failed before a summary was produced. No endpoint reproduction is accepted.'
            fi
          } > /tmp/gatemem-pr46-r0/issue-comment.md
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/gatemem-pr46-r0/issue-comment.md

      - name: Upload R0 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatemem-pr46-r0-audit
          path: /tmp/gatemem-pr46-r0
          if-no-files-found: error
          retention-days: 30
